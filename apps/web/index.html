<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- --bg-page per theme; ThemeProvider overrides both when the user picks a theme. -->
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1317" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&subset=latin,cyrillic&display=swap"
    />
    <title>BookaTurf</title>
    <meta name="description" content="Find a turf near you, see the free times and book online in a minute." />
    <!-- Site-wide share card; venue pages get their own from the API (docs/seo.md). -->
    <meta property="og:site_name" content="BookaTurf" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BookaTurf" />
    <meta property="og:description" content="Find a turf near you, see the free times and book online in a minute." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
